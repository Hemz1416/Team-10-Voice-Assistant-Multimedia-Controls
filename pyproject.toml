[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (unused imports, undefined names)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line length (formatting is handled separately without automated line reflowing)
    "RUF012", # Mutable class attributes (used declaratively for SUPPORTED_INTENTS)
    "B008",   # Function call in argument defaults (standard CLI/test fixtures)
]

[tool.ruff.lint.per-file-ignores]
# Scripts require sys.path modification before importing local src modules
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v"
